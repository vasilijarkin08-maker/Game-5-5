<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сендстоун 5x5 — Смерть не конец</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a1a;color:#eee;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{max-width:1200px;width:100%;background:#141428;border-radius:20px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,0.8)}
h1{text-align:center;font-size:2rem;margin-bottom:5px;background:linear-gradient(45deg,#e94560,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#666;margin-bottom:15px;font-size:.85rem}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:#0f0f23;padding:10px 20px;border-radius:12px;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.team-stats{display:flex;gap:30px;font-weight:600}
.team-stats .t1{color:#e94560}
.team-stats .t2{color:#60a5fa}
.team-stats .alive{color:#4ade80}
.team-stats .dead{color:#f87171}
.team-stats .player-control{color:#f5a623;font-weight:700}
.battlefield{background:#c2b280;border-radius:12px;padding:15px;position:relative;min-height:450px;border:2px solid #8a7a5a;margin-bottom:15px;overflow:hidden}
.battlefield .sand{position:absolute;bottom:0;left:0;right:0;height:100%;background:radial-gradient(ellipse at 50% 100%,#d4b896 0%,#c2b280 40%,#a89070 100%);border-radius:0 0 10px 10px}
.battlefield .sand-pattern{position:absolute;bottom:0;left:0;right:0;height:100%;background-image:radial-gradient(ellipse at 20% 80%, rgba(180,160,120,0.3) 0%, transparent 50%),radial-gradient(ellipse at 80% 70%, rgba(180,160,120,0.2) 0%, transparent 40%),radial-gradient(ellipse at 50% 90%, rgba(160,140,100,0.3) 0%, transparent 60%);border-radius:0 0 10px 10px}
.battlefield .dune{position:absolute;bottom:0;left:0;right:0;height:40%;background:radial-gradient(ellipse at 30% 100%, rgba(180,160,120,0.15) 0%, transparent 70%);border-radius:0 0 10px 10px}
.battlefield .dune2{position:absolute;bottom:0;left:0;right:0;height:30%;background:radial-gradient(ellipse at 70% 100%, rgba(200,180,140,0.1) 0%, transparent 60%);border-radius:0 0 10px 10px}
.battlefield .divider{position:absolute;top:0;bottom:0;left:50%;width:3px;background:linear-gradient(180deg,transparent,rgba(139,119,90,0.3),rgba(139,119,90,0.5),rgba(139,119,90,0.3),transparent);opacity:.5;z-index:1}
.battlefield .divider-dots{position:absolute;top:0;bottom:0;left:50%;width:20px;transform:translateX(-50%);background:radial-gradient(circle at 50% 10%, rgba(139,119,90,0.2) 1px, transparent 1px),radial-gradient(circle at 50% 30%, rgba(139,119,90,0.15) 1px, transparent 1px),radial-gradient(circle at 50% 50%, rgba(139,119,90,0.2) 1px, transparent 1px),radial-gradient(circle at 50% 70%, rgba(139,119,90,0.15) 1px, transparent 1px),radial-gradient(circle at 50% 90%, rgba(139,119,90,0.2) 1px, transparent 1px);background-size:20px 20%;background-repeat:repeat-y;z-index:1}
.unit{position:absolute;transition:all .4s cubic-bezier(.34,1.56,.64,1);z-index:2;width:70px;height:70px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,0.15);box-shadow:0 4px 15px rgba(0,0,0,0.5);cursor:default}
.unit .weapon-icon{font-size:22px;line-height:1}
.unit .weapon-label{font-size:9px;font-weight:700;margin-top:2px;text-shadow:0 0 10px rgba(0,0,0,0.8)}
.unit .name-tag{font-size:8px;opacity:.7;margin-top:1px}
.unit .hp-bar{position:absolute;bottom:-8px;left:10%;width:80%;height:5px;background:#1a1a2e;border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
.unit .hp-bar .fill{height:100%;border-radius:5px;transition:width .3s}
.unit .hp-text{position:absolute;top:-20px;font-size:9px;font-weight:700;background:rgba(0,0,0,0.8);padding:1px 8px;border-radius:10px;border:1px solid rgba(255,255,255,0.1)}
.unit.team1{background:radial-gradient(circle at 30% 30%,#e94560,#5a0a1a);border-color:#e94560}
.unit.team2{background:radial-gradient(circle at 30% 30%,#60a5fa,#0a2a5a);border-color:#60a5fa}
.unit.player{background:radial-gradient(circle at 30% 30%,#f5a623,#5a3a0a)!important;border-color:#f5a623!important;box-shadow:0 0 30px rgba(245,166,35,0.5)!important}
.unit.dead{opacity:.2;transform:scale(.3)!important;filter:grayscale(1);pointer-events:none}
.unit.targetable:not(.dead):hover{transform:scale(1.15);box-shadow:0 0 30px rgba(233,69,96,0.6);cursor:crosshair}
.unit.targetable:not(.dead).selected{box-shadow:0 0 40px rgba(255,0,0,0.8);border-color:#ff0}
.unit.attacking{animation:attackPulse .3s ease}
.unit.hit{animation:hitFlash .3s ease}
.unit.dying{animation:deathAnim .6s ease forwards}
@keyframes attackPulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes hitFlash{0%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 40px #fff,0 0 80px #ff0}100%{box-shadow:0 0 0 rgba(255,255,255,0)}}
@keyframes deathAnim{0%{transform:scale(1);opacity:1}50%{transform:scale(1.5) rotate(20deg);opacity:.5}100%{transform:scale(0);opacity:0}}
.damage-float{position:absolute;font-weight:900;font-size:24px;pointer-events:none;z-index:10;animation:floatUp .8s ease forwards;color:#ff6b6b;text-shadow:0 0 20px rgba(255,0,0,0.8)}
.damage-float.miss{color:#888;font-size:18px}
.damage-float.player-dmg{color:#f5a623;font-size:28px;text-shadow:0 0 30px rgba(245,166,35,0.9)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-100px) scale(1.5)}}
.log{background:#0a0a1a;border-radius:10px;padding:12px;height:150px;overflow-y:auto;font-family:monospace;font-size:.8rem;line-height:1.5;border:1px solid #1a1a3a;margin-bottom:15px}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-track{background:#0a0a1a}
.log::-webkit-scrollbar-thumb{background:#e94560;border-radius:10px}
.log-entry{padding:1px 0;border-bottom:1px solid #111}
.log-entry.damage{color:#fca5a5}
.log-entry.miss{color:#666}
.log-entry.kill{color:#fbbf24;font-weight:700}
.log-entry.win{color:#4ade80;font-size:1rem;font-weight:700;text-align:center;padding:8px 0}
.log-entry.player{color:#f5a623;font-weight:700}
.log-entry.mvp{color:#f5a623;font-size:1.1rem;font-weight:900;text-align:center;padding:6px 0;background:rgba(245,166,35,0.1);border-radius:8px;margin:4px 0;border:1px solid rgba(245,166,35,0.3)}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.weapon-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#0f0f23;padding:8px 15px;border-radius:25px;border:1px solid #1a1a3a}
.weapon-select label{color:#888;font-size:.8rem}
.weapon-select select{background:#1a1a3a;color:#eee;border:1px solid #2a2a4a;padding:5px 10px;border-radius:15px;cursor:pointer;font-size:.8rem}
.weapon-select select:focus{outline:none;border-color:#e94560}
.speed-control{display:flex;align-items:center;gap:10px;background:#0f0f23;padding:5px 15px;border-radius:25px;border:1px solid #1a1a3a}
.speed-control input{width:100px;accent-color:#e94560}
.speed-control span{color:#e94560;font-weight:700;font-size:.8rem;min-width:35px}
button{background:#e94560;border:none;color:#fff;font-weight:700;padding:10px 25px;border-radius:25px;cursor:pointer;transition:.2s;font-size:.9rem}
button:hover:not(:disabled){background:#c73652;transform:scale(1.03)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.secondary{background:#2a2a5a}
button.secondary:hover:not(:disabled){background:#3a3a7a}
button.pause-btn{background:#f5a623;color:#1a1a2e}
button.pause-btn:hover:not(:disabled){background:#e8941a}
.legend{display:flex;gap:15px;justify-content:center;margin-bottom:12px;font-size:.75rem;color:#888;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.dot.pistol{background:#fbbf24}
.dot.rifle{background:#60a5fa}
.dot.sniper{background:#e94560}
.dot.player-dot{background:#f5a623;box-shadow:0 0 10px rgba(245,166,35,0.5)}
.pause-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:none;justify-content:center;align-items:center;z-index:50;border-radius:12px;font-size:2rem;font-weight:700;color:#f5a623;letter-spacing:4px;backdrop-filter:blur(3px)}
.pause-overlay.show{display:flex}
@media(max-width:700px){.unit{width:55px;height:55px}.unit .weapon-icon{font-size:16px}}
</style>
</head>
<body>
<div class="container">
<h1>⚔ Сендстоун 5x5</h1>
<div class="subtitle">песчаная пустыня — вы за синюю команду</div>
<div class="legend">
<span><span class="dot pistol"></span> Пистолет 🔫</span>
<span><span class="dot rifle"></span> Автомат ⚔️</span>
<span><span class="dot sniper"></span> Снайперка 🎯</span>
<span><span class="dot player-dot"></span> ⭐ Вы</span>
</div>

<div class="top-bar">
<div class="team-stats">
<span class="t1">🔴 Команда 1: <span id="t1-count" class="alive">5</span></span>
<span class="t2">🔵 Команда 2: <span id="t2-count" class="alive">5</span></span>
<span class="player-control">⭐ Вы: <span id="player-status">жив</span></span>
</div>
<span id="round-display" style="color:#888;">Раунд: 0</span>
</div>

<div class="battlefield" id="battlefield">
<div class="sand"></div>
<div class="sand-pattern"></div>
<div class="dune"></div>
<div class="dune2"></div>
<div class="divider"></div>
<div class="divider-dots"></div>
<div class="pause-overlay" id="pauseOverlay">⏸ ПАУЗА</div>
<div class="hint" style="position:absolute;bottom:15px;left:50%;transform:translateX(-50%);color:#1a1a2e;font-size:.9rem;font-weight:700;background:rgba(255,255,200,0.85);padding:6px 20px;border-radius:20px;pointer-events:none;z-index:5;border:2px solid #8a7a5a;box-shadow:0 4px 15px rgba(0,0,0,0.3);text-shadow:0 1px 2px rgba(255,255,255,0.3)" id="hint">🎯 Кликните по врагу, чтобы выстрелить</div>
</div>

<div class="log" id="log"></div>

<div class="controls">
<div class="weapon-select">
<label>🔫 Оружие:</label>
<select id="weaponType">
<option value="pistol">Пистолет</option>
<option value="rifle" selected>Автомат</option>
<option value="sniper">Снайперка</option>
</select>
<select id="weaponModel">
<option value="АКР">АКР</option>
<option value="М4А1">М4А1</option>
</select>
</div>
<div class="speed-control">
<label style="color:#666;">🐢</label>
<input type="range" id="speed" min="300" max="1500" value="600" step="50">
<label style="color:#666;">🐇</label>
<span id="speed-label">0.6с</span>
</div>
<button id="pause-btn" class="pause-btn" disabled>⏸ Пауза</button>
<button id="start-btn">▶ Битва</button>
<button id="reset-btn" class="secondary">🔄 Заново</button>
</div>
</div>
<script>
// ============================================================
// НОВЫЕ ЦИФРЫ УРОНА:
// Пистолеты: ЮСП = 30, Дигл = 50
// Автоматы: АКР = 65, М4А1 = 55
// Снайперки: АВМ = 80, М40 = 60
// ============================================================
const DMG = {"ЮСП":30,"Дигл":50,"АКР":65,"М4А1":55,"АВМ":80,"М40":60};
const WEAPON_ICONS = {"ЮСП":"🔫","Дигл":"🔫","АКР":"⚔️","М4А1":"⚔️","АВМ":"🎯","М40":"🎯"};
const PISTOLS = ["ЮСП","Дигл"];
const RIFLES = ["АКР","М4А1"];
const SNIPERS = ["АВМ","М40"];

// УНИКАЛЬНЫЕ ИМЕНА ДЛЯ КОМАНДЫ 1
const NAMES1 = ["Бархан","Скорпион","Кобра","Шакал","Гюрза"];
// УНИКАЛЬНЫЕ ИМЕНА ДЛЯ КОМАНДЫ 2 (боты)
const NAMES2 = ["Тигр","Леопард","Ягуар","Пума","Рысь"];

let team1=[], team2=[], player=null, active=false, paused=false, round=0, logs=[], timeoutId=null;
let selectedTarget=null, isPlayerTurn=true;
let damageStats = {}; // Хранит урон каждого игрока

class Unit {
    constructor(name, team, role, isPlayer=false) {
        this.name=name; this.team=team; this.role=role; this.hp=100;
        this.weapon=this.getWeapon(role); this.x=0; this.y=0; this.isPlayer=isPlayer;
        this.totalDamage = 0; // Суммарный нанесённый урон
    }
    getWeapon(role) {
        if(role==='pistol') return PISTOLS[Math.floor(Math.random()*PISTOLS.length)];
        if(role==='sniper') return SNIPERS[Math.floor(Math.random()*SNIPERS.length)];
        return RIFLES[Math.floor(Math.random()*RIFLES.length)];
    }
    setWeapon(w){this.weapon=w}
    isAlive(){return this.hp>0}
    addDamage(dmg){this.totalDamage += dmg}
}

function createTeams() {
    const roles=['pistol','sniper','rifle','rifle','rifle'];
    
    // Перемешиваем роли для команды 1
    const shuffled1=[...roles]; 
    for(let i=shuffled1.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled1[i],shuffled1[j]]=[shuffled1[j],shuffled1[i]]}
    const t1=[]; 
    for(let i=0;i<5;i++) {
        t1.push(new Unit(NAMES1[i],"Команда1",shuffled1[i]));
    }
    
    // Перемешиваем роли для команды 2
    const shuffled2=[...roles]; 
    for(let i=shuffled2.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled2[i],shuffled2[j]]=[shuffled2[j],shuffled2[i]]}
    const t2=[]; 
    t2.push(new Unit(`⭐ Вы`,"Команда2",shuffled2[0],true));
    for(let i=1;i<5;i++) {
        t2.push(new Unit(NAMES2[i-1],"Команда2",shuffled2[i]));
    }
    
    return [t1,t2];
}

function alive(team){return team.filter(p=>p.isAlive())}

function renderField() {
    const field=document.getElementById('battlefield');
    const w=field.clientWidth-40, h=field.clientHeight-40;
    const positions1 = [{x:0.08,y:0.15},{x:0.08,y:0.40},{x:0.08,y:0.65},{x:0.20,y:0.28},{x:0.20,y:0.53}];
    const positions2 = [{x:0.92,y:0.15},{x:0.92,y:0.40},{x:0.92,y:0.65},{x:0.80,y:0.28},{x:0.80,y:0.53}];
    team1.forEach((p,i)=>{p.x=20+w*positions1[i].x; p.y=20+h*positions1[i].y});
    team2.forEach((p,i)=>{p.x=20+w*positions2[i].x; p.y=20+h*positions2[i].y});
    field.querySelectorAll('.unit').forEach(el=>el.remove());
    const all=[...team1,...team2];
    all.forEach(p=>{
        const div=document.createElement('div');
        let classes=`unit ${p.team==="Команда1"?'team1':'team2'}`;
        if(p.isPlayer) classes+=' player';
        if(p.isAlive() && p.team==="Команда1" && isPlayerTurn && active && player && player.isAlive()) classes+=' targetable';
        if(p.isAlive() && p.team==="Команда1" && selectedTarget===p) classes+=' selected';
        if(!p.isAlive()) classes+=' dead';
        div.className=classes;
        div.id=`unit-${p.name}`;
        div.style.left=`${p.x}px`;
        div.style.top=`${p.y}px`;
        div.style.borderColor=p.isAlive()?(p.isPlayer?'#f5a623':p.team==="Команда1"?'#e94560':'#60a5fa'):'#333';
        const hpColor=p.hp>60?'#4ade80':p.hp>30?'#f5a623':'#e94560';
        div.innerHTML=`
            <span class="hp-text">${p.hp}</span>
            <span class="weapon-icon">${WEAPON_ICONS[p.weapon]||'🔫'}</span>
            <span class="weapon-label">${p.weapon}</span>
            <span class="name-tag">${p.isPlayer?'⭐ ':''}${p.name}</span>
            <div class="hp-bar"><div class="fill" style="width:${p.hp}%;background:${hpColor}"></div></div>
        `;
        if(p.team==="Команда1" && p.isAlive() && active && isPlayerTurn && player && player.isAlive()){
            div.addEventListener('click',()=>selectTarget(p));
        }
        field.appendChild(div);
    });
    updateStats();
    updateHint();
}
function updateUnit(p) {
    const el=document.getElementById(`unit-${p.name}`);
    if(!el) return;
    let classes=`unit ${p.team==="Команда1"?'team1':'team2'}`;
    if(p.isPlayer) classes+=' player';
    if(p.isAlive() && p.team==="Команда1" && isPlayerTurn && active && player && player.isAlive()) classes+=' targetable';
    if(p.isAlive() && p.team==="Команда1" && selectedTarget===p) classes+=' selected';
    if(!p.isAlive()) classes+=' dead';
    el.className=classes;
    el.style.borderColor=p.isAlive()?(p.isPlayer?'#f5a623':p.team==="Команда1"?'#e94560':'#60a5fa'):'#333';
    const fill=el.querySelector('.fill');
    if(fill){fill.style.width=`${p.hp}%`; fill.style.background=p.hp>60?'#4ade80':p.hp>30?'#f5a623':'#e94560';}
    const hpText=el.querySelector('.hp-text');
    if(hpText) hpText.textContent=p.hp;
}

function updateStats() {
    const a1=alive(team1).length, a2=alive(team2).length;
    document.getElementById('t1-count').textContent=a1;
    document.getElementById('t2-count').textContent=a2;
    document.getElementById('t1-count').className=a1>0?'alive':'dead';
    document.getElementById('t2-count').className=a2>0?'alive':'dead';
    document.getElementById('round-display').textContent=`Раунд: ${round}`;
    if(player){
        document.getElementById('player-status').textContent=player.isAlive()?'❤️ жив':'💀 мёртв';
        document.getElementById('player-status').style.color=player.isAlive()?'#4ade80':'#f87171';
    }
}

function updateHint() {
    const hint=document.getElementById('hint');
    if(!active) hint.textContent='🎮 Нажмите "Битва" для начала';
    else if(player && !player.isAlive()) hint.textContent='💀 Вы погибли! Наблюдайте за боем...';
    else if(paused) hint.textContent='⏸ ПАУЗА';
    else if(!isPlayerTurn) hint.textContent='⏳ Ход ботов...';
    else if(selectedTarget) hint.textContent=`🎯 Цель: ${selectedTarget.name} (${selectedTarget.hp} HP) | Кликните ещё раз для выстрела`;
    else if(alive(team1).length>0) hint.textContent='🎯 Кликните по врагу (красный)';
    else hint.textContent='🏆 Все враги уничтожены!';
}

function selectTarget(target) {
    if(!active||paused||!player||!player.isAlive()||!isPlayerTurn) return;
    if(selectedTarget===target){playerShoot(target); return;}
    selectedTarget=target;
    renderField();
    addLog(`🎯 Выбрана цель: ${target.name} (${target.hp} HP)`,'player');
}

function playerShoot(target) {
    if(!active||paused||!player||!player.isAlive()||!target.isAlive()||!isPlayerTurn) return;
    isPlayerTurn=false;
    const dmg=DMG[player.weapon]||10;
    const hit=Math.random()<0.85;
    animateAttack(player,target);
    if(hit){
        target.hp-=dmg; if(target.hp<0) target.hp=0;
        player.addDamage(dmg);
        showDamage(target.x,target.y,`-${dmg}`,false,true);
        addLog(`⭐ ВЫ [${player.weapon}] ➜ ${target.name} -${dmg} HP!`,'player');
        if(target.hp<=0){animateDeath(target); addLog(`💀 ${target.name} убит!`,'kill'); selectedTarget=null;}
        updateUnit(target); updateUnit(player); updateStats();
    }else{
        showDamage(target.x,target.y,'МИМО',true);
        addLog(`⭐ Вы промахнулись по ${target.name}`,'miss');
    }
    if(alive(team1).length===0){endBattle(true); return;}
    if(alive(team2).length===0){endBattle(false); return;}
    if(active && !paused) setTimeout(botTurn,400);
}

function botTurn() {
    if(paused||!active) return;
    const blueBots=alive(team2).filter(p=>!p.isPlayer);
    const enemies=alive(team1);
    if(blueBots.length===0 || enemies.length===0){
        if(enemies.length===0){endBattle(true); return;}
        if(blueBots.length===0 && alive(team2).length===0){endBattle(false); return;}
        setTimeout(redTurn,300);
        return;
    }
    let idx=0;
    function shootNext(){
        if(paused||!active) return;
        if(idx>=blueBots.length){
            if(alive(team1).length===0){endBattle(true); return;}
            if(alive(team2).length===0){endBattle(false); return;}
            setTimeout(redTurn,300);
            return;
        }
        const bot=blueBots[idx];
        if(!bot.isAlive()){idx++; setTimeout(shootNext,100); return;}
        const e=alive(team1);
        if(e.length===0){endBattle(true); return;}
        const target=e[Math.floor(Math.random()*e.length)];
        if(!target.isAlive()){idx++; setTimeout(shootNext,100); return;}
        const dmg=DMG[bot.weapon]||10;
        const hit=Math.random()<0.75;
        animateAttack(bot,target);
        if(hit){
            target.hp-=dmg; if(target.hp<0)target.hp=0;
            bot.addDamage(dmg);
            showDamage(target.x,target.y,`-${dmg}`);
            addLog(`${bot.name} [${bot.weapon}] ➜ ${target.name} -${dmg} HP`,'damage');
            if(target.hp<=0){animateDeath(target); addLog(`💀 ${target.name} выбыл!`,'kill'); if(selectedTarget===target)selectedTarget=null;}
            updateUnit(target); updateUnit(bot); updateStats();
        }else{showDamage(target.x,target.y,'МИМО',true); addLog(`${bot.name} промахнулся`,'miss');}
        if(alive(team1).length===0){endBattle(true); return;}
        if(alive(team2).length===0){endBattle(false); return;}
        idx++; setTimeout(shootNext,getSpeed()/2);
    }
    shootNext();
}

function redTurn() {
    if(paused||!active) return;
    const reds=alive(team1);
    const targets=alive(team2);
    if(reds.length===0 || targets.length===0){
        if(reds.length===0){endBattle(true); return;}
        if(targets.length===0){endBattle(false); return;}
        return;
    }
    let idx=0;
    function shootNext(){
        if(paused||!active) return;
        if(idx>=reds.length){
            if(alive(team1).length===0){endBattle(true); return;}
            if(alive(team2).length===0){endBattle(false); return;}
            round++;
            addLog(`--- Раунд ${round} ---`,'info');
            if(player && player.isAlive()){
                isPlayerTurn=true;
                selectedTarget=null;
                renderField();
                updateStats();
            } else {
                isPlayerTurn=false;
                renderField();
                updateStats();
                if(!paused) setTimeout(botTurn,300);
            }
            return;
        }
        const red=reds[idx];
        if(!red.isAlive()){idx++; setTimeout(shootNext,100); return;}
        const t=alive(team2);
        if(t.length===0){endBattle(false); return;}
        const target=t[Math.floor(Math.random()*t.length)];
        if(!target.isAlive()){idx++; setTimeout(shootNext,100); return;}
        const dmg=DMG[red.weapon]||10;
        const hit=Math.random()<0.75;
        animateAttack(red,target);
        if(hit){
            target.hp-=dmg; if(target.hp<0)target.hp=0;
            red.addDamage(dmg);
            showDamage(target.x,target.y,`-${dmg}`);
            addLog(`🔴 ${red.name} [${red.weapon}] ➜ ${target.name} -${dmg} HP`,'damage');
            if(target.hp<=0){animateDeath(target); addLog(`💀 ${target.name} выбыл!`,'kill');}
            updateUnit(target); updateUnit(red); updateStats();
        }else{showDamage(target.x,target.y,'МИМО',true); addLog(`${red.name} промахнулся`,'miss');}
        if(alive(team1).length===0){endBattle(true); return;}
        if(alive(team2).length===0){endBattle(false); return;}
        idx++; setTimeout(shootNext,getSpeed()/2);
    }
    shootNext();
}

function showDamage(x,y,text,isMiss=false,isPlayer=false){
    const field=document.getElementById('battlefield');
    const el=document.createElement('div');
    el.className=`damage-float ${isMiss?'miss':''} ${isPlayer?'player-dmg':''}`;
    el.textContent=text;
    el.style.left=`${x}px`; el.style.top=`${y-10}px`;
    field.appendChild(el);
    setTimeout(()=>el.remove(),800);
}
function animateAttack(a,t){
    const aEl=document.getElementById(`unit-${a.name}`), tEl=document.getElementById(`unit-${t.name}`);
    if(aEl){aEl.classList.remove('attacking'); void aEl.offsetWidth; aEl.classList.add('attacking');}
    if(tEl){tEl.classList.remove('hit'); void tEl.offsetWidth; tEl.classList.add('hit');}
    setTimeout(()=>{if(aEl)aEl.classList.remove('attacking'); if(tEl)tEl.classList.remove('hit');},400);
}
function animateDeath(p){
    const el=document.getElementById(`unit-${p.name}`);
    if(el){el.classList.remove('dead'); el.classList.add('dying'); setTimeout(()=>{el.className=`unit ${p.team==="Команда1"?'team1':'team2'} dead`;},600);}
}

function addLog(msg,type='info'){logs.push({msg,type}); const el=document.getElementById('log'); el.innerHTML=logs.map(l=>`<div class="log-entry ${l.type}">${l.msg}</div>`).join(''); el.scrollTop=el.scrollHeight;}

function togglePause(){
    if(!active) return;
    paused = !paused;
    const btn = document.getElementById('pause-btn');
    const overlay = document.getElementById('pauseOverlay');
    if(paused){
        btn.textContent = '▶ Продолжить';
        overlay.classList.add('show');
        if(timeoutId){clearTimeout(timeoutId); timeoutId=null;}
    }else{
        btn.textContent = '⏸ Пауза';
        overlay.classList.remove('show');
        updateHint();
        if(active && !isPlayerTurn){
            if(alive(team1).length>0 && alive(team2).length>0){
                setTimeout(botTurn,300);
            }
        }
    }
}

function getSpeed(){return parseInt(document.getElementById('speed').value);}
function updateWeaponOptions(){
    const type=document.getElementById('weaponType').value;
    const ms=document.getElementById('weaponModel');
    ms.innerHTML='';
    const weapons=type==='pistol'?PISTOLS:type==='rifle'?RIFLES:SNIPERS;
    weapons.forEach(w=>{const o=document.createElement('option'); o.value=w; o.textContent=w; ms.appendChild(o);});
}
function applyWeaponToPlayer(){if(!player||active)return; const w=document.getElementById('weaponModel').value; player.setWeapon(w); player.role=document.getElementById('weaponType').value; renderField(); addLog(`⭐ Вы выбрали: ${w}`,'player');}

function resetGame(){
    if(timeoutId){clearTimeout(timeoutId); timeoutId=null;}
    active=false; paused=false; logs=[]; round=0; selectedTarget=null; isPlayerTurn=true;
    document.getElementById('pauseOverlay').classList.remove('show');
    const [t1,t2]=createTeams(); team1=t1; team2=t2; player=team2[0];
    applyWeaponToPlayer();
    renderField(); updateStats();
    document.getElementById('log').innerHTML='';
    addLog('⚔️ Новая игра! Вы за синюю команду ⭐','info');
    addLog('👥 Команда 1: удав, Скорпион, Кобра, коготь, Гюрза','info');
    addLog('👥 Команда 2: Тигр, Леопард, Ягуар, Пума, Рысь','info');
    addLog('💀 После вашей смерти бой продолжается до полной победы!','info');
    document.getElementById('start-btn').textContent='▶ Битва';
    document.getElementById('start-btn').disabled=false;
    document.getElementById('pause-btn').textContent='⏸ Пауза';
   document.getElementById('pause-btn').disabled=true;
    document.getElementById('weaponType').disabled=false;
    document.getElementById('weaponModel').disabled=false;
    updateHint();
}

function startBattle(){
    if(active)return;
    if(alive(team1).length===0||alive(team2).length===0){resetGame(); setTimeout(startBattle,200); return;}
    active=true; paused=false; selectedTarget=null; isPlayerTurn=true;
    document.getElementById('start-btn').textContent='⏳ Бой...';
    document.getElementById('start-btn').disabled=true;
    document.getElementById('pause-btn').disabled=false;
    document.getElementById('pause-btn').textContent='⏸ Пауза';
    document.getElementById('pauseOverlay').classList.remove('show');
    document.getElementById('weaponType').disabled=true;
    document.getElementById('weaponModel').disabled=true;
    logs=[]; addLog('🔥 Битва началась!','info'); round=0; renderField(); updateStats(); updateHint();
}

function getMVP(winningTeam) {
    let bestPlayer = null;
    let bestDamage = -1;
    const allPlayers = [...team1, ...team2];
    for(const p of allPlayers) {
        if(p.team === winningTeam && p.totalDamage > bestDamage) {
            bestDamage = p.totalDamage;
            bestPlayer = p;
        }
    }
    return bestPlayer;
}

function endBattle(playerWon){
    if(timeoutId){clearTimeout(timeoutId); timeoutId=null;}
    active=false; paused=false; isPlayerTurn=true;
    document.getElementById('pauseOverlay').classList.remove('show');
    document.getElementById('start-btn').textContent='▶ Битва';
    document.getElementById('start-btn').disabled=false;
    document.getElementById('pause-btn').disabled=true;
    document.getElementById('pause-btn').textContent='⏸ Пауза';
    document.getElementById('weaponType').disabled=false;
    document.getElementById('weaponModel').disabled=false;
    
    const winningTeam = playerWon ? "Команда2" : "Команда1";
    const mvp = getMVP(winningTeam);
    
    if(playerWon){
        addLog('🏆 ПОБЕДА! Команда 2 уничтожила всех врагов!','win');
    } else {
        addLog('💀 Команда 1 победила!','win');
    }
    
    if(mvp) {
        addLog(`⭐ MVP МАТЧА: ${mvp.name} (${mvp.totalDamage} урона) ⭐`,'mvp');
    }
    
    renderField(); updateStats(); updateHint();
}

resetGame();
document.getElementById('weaponType').addEventListener('change',updateWeaponOptions);
document.getElementById('weaponModel').addEventListener('change',applyWeaponToPlayer);
document.getElementById('speed').addEventListener('input',function(){document.getElementById('speed-label').textContent=(this.value/1000).toFixed(1)+'с';});
document.getElementById('start-btn').onclick=startBattle;
document.getElementById('reset-btn').onclick=resetGame;
document.getElementById('pause-btn').onclick=togglePause;
window.addEventListener('resize',renderField);
updateWeaponOptions();
console.log('✅ Игра загружена! ⭐ Вы за синюю команду');
</script>
</body>
</html>
